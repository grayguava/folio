<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · /*__SITE_NAME__*/Site Name</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .error-page { text-align: center; }
    .error-page h1 { font-size: 4rem; margin-bottom: 0.5rem; }
    .error-page p { color: var(--dim); margin-bottom: 2rem; }
    .error-page .path { word-break: break-all; }
    .error-page a { color: var(--accent); }
    .error-page a:hover { text-decoration: underline; }
  </style>
</head>


<body>

  <div class="wrap">
    <div class="error-page">
      <header class="page-header">
        <h1>404<span class="type-cursor">_</span></h1>
        <p>not found: <span class="path" id="req-path">/</span></p>
        <p><a href="/">go home</a> or press <kbd>h</kbd></p>
      </header>
    </div>
  </div>

  <script>
    (function() {
      var saved;
      try { saved = localStorage.getItem('theme'); } catch (_) {}
      if (saved !== 'light' && saved !== 'dark') saved = /*__THEME_DEFAULT__*/'dark';
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
    document.getElementById('req-path').textContent = location.pathname;
    document.addEventListener('keydown', function(e) {
      if (e.key === 'h') window.location.href = '/';
    });
  </script>

</body>

</html>
