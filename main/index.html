<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>/*__SITE_NAME__*/Site Name</title>


  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/markdown.css" />
  <link rel="stylesheet" href="/assets/css/hljs.css" />
</head>


<body>

  <div id="site-loader">
    <pre class="boot"><span class="p">&gt;</span><span class="cursor">_</span></pre>
  </div>


  <script>
    // apply saved theme before paint (no theme flash)
    (function() {
      var t;
      try { t = localStorage.getItem('theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark') t = /*__THEME_DEFAULT__*/'dark';
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <script id="boot-loader">
    var _loaded = false, _timerDone = false;
    try { if (sessionStorage.getItem('site_seen')) _timerDone = true; } catch (_) {}
    function _hideLoader() {
      if (!_loaded || !_timerDone) return;
      var l = document.getElementById('site-loader');
      l.classList.add('loaded');
      setTimeout(function() { l.style.display = 'none'; }, 350);
    }
    setTimeout(function() { _timerDone = true; try { sessionStorage.setItem('site_seen', '1'); } catch (_) {} _hideLoader(); }, _timerDone ? 0 : /*__BOOT_MS__*/1200);
    window.addEventListener('load', function() {
      _loaded = true;
      _hideLoader();
    });
  </script>


  <div class="wrap">
    <section id="page-home" class="page">
      <h1 class="landing-name"><span id="home-name"></span><span class="type-cursor" aria-hidden="true">_</span></h1>
      <p class="sub" id="home-sub"></p>
      <p class="bio" id="home-bio"></p>

      <div class="dirs" id="home-dirs"></div>

      <div class="socials" id="home-socials"></div>

      <p class="hint">press <kbd>h</kbd> <kbd>b</kbd> <kbd>p</kbd> <kbd>s</kbd> <kbd>w</kbd> to navigate · <kbd>t</kbd> theme</p>
    </section>


    <section id="page-blog" class="page" style="display:none">
      <a class="back" href="/"><span aria-hidden="true">←</span> home/</a>
      <h1 class="path">blog/</h1>
      <p class="sub" id="blog-sub"></p>
      <div id="blog-list"></div>
      <p class="hint">press <kbd>h</kbd> <kbd>b</kbd> <kbd>p</kbd> <kbd>s</kbd> <kbd>w</kbd> to navigate · <kbd>t</kbd> theme</p>
    </section>


    <section id="page-post" class="page" style="display:none">
      <a class="back" href="/blog/"><span aria-hidden="true">←</span> blog/</a>
      <article id="post-content"></article>
    </section>


    <section id="page-projects" class="page" style="display:none">
      <a class="back" href="/"><span aria-hidden="true">←</span> home/</a>
      <h1 class="path">projects/</h1>
      <p class="sub" id="projects-sub"></p>
      <div id="projects-list"></div>
      <p class="hint">press <kbd>h</kbd> <kbd>b</kbd> <kbd>p</kbd> <kbd>s</kbd> <kbd>w</kbd> to navigate · <kbd>t</kbd> theme</p>
    </section>


    <section id="page-skills" class="page" style="display:none">
      <a class="back" href="/"><span aria-hidden="true">←</span> home/</a>
      <h1 class="path">skills/</h1>
      <p class="sub" id="skills-sub"></p>
      <div id="skills-list"></div>
      <p class="hint">press <kbd>h</kbd> <kbd>b</kbd> <kbd>p</kbd> <kbd>s</kbd> <kbd>w</kbd> to navigate · <kbd>t</kbd> theme</p>
    </section>


    <section id="page-work" class="page" style="display:none">
      <a class="back" href="/"><span aria-hidden="true">←</span> home/</a>
      <h1 class="path">work/</h1>
      <p class="sub" id="work-sub"></p>
      <div id="work-list"></div>
      <p class="hint">press <kbd>h</kbd> <kbd>b</kbd> <kbd>p</kbd> <kbd>s</kbd> <kbd>w</kbd> to navigate · <kbd>t</kbd> theme</p>
    </section>
  </div>


<script src="/assets/js/posts.js"></script>
<script src="/assets/js/pages.js"></script>
<script src="/assets/js/app.js"></script>


</body>


</html>
